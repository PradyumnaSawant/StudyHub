{% extends "base.html" %}

{% block title %}Upload Study Material - StudyHub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-gradient text-white rounded-3 p-3 d-inline-flex mb-3">
                        <i class="fa-solid fa-cloud-arrow-up fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Upload Study Material</h3>
                    <p class="text-muted small">Share lecture notes, PYQs, or revision sheets with fellow students</p>
                </div>

                <form action="/resources/upload" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Resource Title *</label>
                        <input type="text" name="title" class="form-control form-control-glass" placeholder="e.g. Unit 3: Graph Algorithms & Minimum Spanning Trees" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">Subject *</label>
                            <select name="subject_id" class="form-select form-select-glass" required>
                                <option value="" disabled selected>Select Engineering Subject...</option>
                                {% for s in subjects %}
                                <option value="{{ s.id }}">[{{ s.code }}] {{ s.name }} ({{ s.department }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">Material Type *</label>
                            <select name="type" class="form-select form-select-glass" required>
                                <option value="notes" selected>Lecture Notes</option>
                                <option value="PYQ">Previous Year Question (PYQ)</option>
                                <option value="question_bank">Question Bank / Assignment</option>
                                <option value="revision">Revision Formula Sheet</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Syllabus Tag / Unit Module *</label>
                        <input type="text" name="syllabus_tag" class="form-control form-control-glass" placeholder="e.g. Unit 3: Graphs (2024 Pattern)" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Description / Key Highlights (Optional)</label>
                        <textarea name="description" rows="3" class="form-control form-control-glass" placeholder="Briefly describe what this note covers, key derivations, or exam years included..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Upload Document File (PDF, DOCX, TXT) *</label>
                        <input type="file" name="file" class="form-control form-control-glass" accept=".pdf,.docx,.doc,.pptx,.txt" required>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 mb-2"><i class="fa-solid fa-cloud-arrow-up me-2"></i> Publish Resource</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
