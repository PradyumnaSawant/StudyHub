<div class="d-flex align-items-center justify-content-between mb-3 text-muted small">
    <div>Found <strong>{{ resources|length }}</strong> study materials matching your criteria</div>
</div>

<div class="row g-4">
    {% if resources %}
        {% for resource in resources %}
        <div class="col-md-6 col-lg-4">
            {% include "components/resource_card.html" %}
        </div>
        {% endfor %}
    {% else %}
    <div class="col-12">
        <div class="glass-panel p-5 text-center text-muted">
            <i class="fa-solid fa-magnifying-glass-minus fs-1 mb-3 text-secondary"></i>
            <h5 class="text-white fw-bold">No resources found</h5>
            <p class="mb-0">Try clearing or broadening your search keywords and filter selections.</p>
        </div>
    </div>
    {% endif %}
</div>
