<div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content modal-content-glass">
            <div class="modal-header border-secondary border-opacity-25 pb-3">
                <div class="d-flex align-items-center gap-2">
                    <div class="p-2 rounded-3 bg-warning bg-opacity-25 text-warning">
                        <i class="fa-solid fa-wand-magic-sparkles fs-4"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold text-white mb-0">AI Study Summary</h5>
                        <span class="text-muted small">{{ resource.title }}</span>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" onclick="document.getElementById('modal-container').innerHTML = ''"></button>
            </div>
            
            <div class="modal-body py-4">
                <div class="bg-dark bg-opacity-70 p-4 rounded-3 border border-secondary border-opacity-25 font-monospace small leading-relaxed" style="white-space: pre-wrap;">
{{ summary }}
                </div>
            </div>

            <div class="modal-footer border-secondary border-opacity-25 pt-3">
                <button type="button" class="btn btn-glass" onclick="document.getElementById('modal-container').innerHTML = ''">Close</button>
                <a href="/resources/{{ resource.id }}/download" class="btn btn-primary-gradient" target="_blank"><i class="fa-solid fa-download me-1"></i> Download Full Document</a>
            </div>
        </div>
    </div>
</div>
