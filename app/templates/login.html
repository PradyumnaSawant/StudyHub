{% extends "base.html" %}

{% block title %}Log In - StudyHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-gradient text-white rounded-3 p-3 d-inline-flex mb-3">
                        <i class="fa-solid fa-right-to-bracket fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                    <p class="text-muted small">Access your personalized engineering study portal</p>
                </div>

                {% if error %}
                <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger py-2 px-3 rounded-3 small mb-4">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error }}
                </div>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-glass" placeholder="student@engineering.edu" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-glass" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 mb-3">Log In to StudyHub</button>
                </form>

                <div class="text-center text-muted small">
                    Don't have an account yet? <a href="/register" class="text-primary text-decoration-none fw-semibold">Sign Up Free</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
