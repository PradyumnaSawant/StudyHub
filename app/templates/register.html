{% extends "base.html" %}

{% block title %}Sign Up - StudyHub Engineering Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-gradient text-white rounded-3 p-3 d-inline-flex mb-3">
                        <i class="fa-solid fa-user-plus fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Create Student Account</h3>
                    <p class="text-muted small">Personalize your course dashboard & study materials</p>
                </div>

                {% if error %}
                <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger py-2 px-3 rounded-3 small mb-4">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error }}
                </div>
                {% endif %}

                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control form-control-glass" placeholder="Kamonmi" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-glass" placeholder="alex@engineering.edu" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-glass" placeholder="••••••••" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">Role</label>
                            <select name="role" class="form-select form-select-glass">
                                <option value="Student" selected>Student</option>
                                <option value="Verifier">Faculty / Moderator</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">Engineering Branch</label>
                            <select name="course" class="form-select form-select-glass">
                                <option value="CSE" selected>Computer Science (CSE)</option>
                                <option value="ECE">Electronics (ECE)</option>
                                <option value="MECH">Mechanical (MECH)</option>
                                <option value="CIVIL">Civil Engineering (CIVIL)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label class="form-label text-muted small fw-semibold">College / Institute</label>
                            <input type="text" name="college" class="form-control form-control-glass" placeholder="MIT College of Engineering">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-semibold">Current Semester</label>
                            <select name="semester" class="form-select form-select-glass">
                                {% for sem in range(1, 9) %}
                                <option value="{{ sem }}">Semester {{ sem }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 mb-3">Complete Registration</button>
                </form>

                <div class="text-center text-muted small">
                    Already have an account? <a href="/login" class="text-primary text-decoration-none fw-semibold">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
